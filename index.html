<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS PWA: 상단은 OS 상태바에 맡기고(theme-color 로 칠해진다) 앱은 그 아래에서 시작한다.
         viewport-fit=cover 는 하단 홈 인디케이터 inset 때문에 유지한다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FFFCEF" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.jpg" />
    <link rel="preload" as="image" href="/assets/wordmark/P.png" />
    <link rel="preload" as="image" href="/assets/wordmark/I.png" />
    <link rel="preload" as="image" href="/assets/wordmark/C.png" />
    <link rel="preload" as="image" href="/assets/wordmark/T.png" />
    <link rel="preload" as="image" href="/assets/wordmark/R.png" />
    <link rel="preload" as="image" href="/assets/wordmark/E.png" />
    <title>PicTree</title>
    <!--
      스플래시는 번들이 아니라 문서에 직접 박아둔다. React 오버레이로 만들면 main.tsx 가
      파싱·실행된 뒤에야 뜨므로 그 앞의 빈 화면 구간이 그대로 남는다. 여기 있으면 첫 페인트부터
      보인다. 제거는 shared/lib/splash.ts 담당.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 앱 base 배경(PicTree/100 크림)과 동일 — manifest 의 background_color 와도 같아
           PWA 기동 화면에서 스플래시로 넘어갈 때 색이 튀지 않는다. */
        background: #fffcef;
        transition: opacity 320ms ease-out;
      }

      #splash.is-hiding {
        opacity: 0;
      }

      /*
       * 글자가 놓이는 무대. 배치값(--l/--t/--w)이 전부 무대 대비 % 라서, 무대의 가로:세로
       * 비율만 375:560 으로 고정해 두면 어떤 화면에서도 구도가 그대로 유지된다.
       * 가로·세로 중 먼저 걸리는 쪽에 맞춰 줄어들도록 min() 으로 두 축을 함께 건다.
       */
      #splash-road {
        --stage-w: min(390px, 100vw, calc(100dvh * 375 / 560));
        position: relative;
        width: var(--stage-w);
        height: calc(var(--stage-w) * 560 / 375);
      }

      /*
       * 글자는 곡선 길을 따라 멀리(작게)→가까이(크게) 놓인다. 좌표는 회전 전 상자의
       * 왼쪽 위 기준이고 rotate 는 상자 중심을 축으로 도므로, 중심점은 경로 위에 그대로 남는다.
       * --i 는 진행 순서 = 깊이. 값이 클수록 가까운 글자라 위에 겹쳐 그린다.
       */
      #splash-road img {
        position: absolute;
        left: var(--l);
        top: var(--t);
        width: var(--w);
        height: auto;
        z-index: var(--i);
        transform: rotate(var(--r));
        animation: splash-approach 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
        /* 먼 글자부터 차례로 도착한다 */
        animation-delay: calc(var(--i) * 90ms);
      }

      /* 등장: 한 뼘 더 멀리(작고 뒤쪽)에서 제자리로 다가온다. */
      @keyframes splash-approach {
        from {
          opacity: 0;
          transform: rotate(var(--r)) scale(0.82) translateY(6%);
        }
        to {
          opacity: 1;
          transform: rotate(var(--r)) scale(1) translateY(0);
        }
      }

      /* 외부 리다이렉트로 돌아온 착지 경로 — 아래 스크립트 참고 */
      .no-splash #splash {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }

        #splash-road img {
          animation: none;
        }
      }
    </style>
    <script>
      /*
       * 소셜 로그인·결제는 외부 서비스로 페이지를 통째로 넘겼다가 돌아온다(location.assign,
       * 토스 successUrl). 돌아오는 길이 '새 문서 로드'라 스플래시가 앱을 켤 때와 똑같이 다시
       * 뜨는데, 사용자 입장에선 앱 시작이 아니라 진행하던 흐름의 복귀 지점이다. 그 경로에서만 끈다.
       *
       * head 에서 클래스로 거는 이유: 스플래시가 그려지기 전에 숨겨야 깜빡임이 없다.
       * 경로는 shared/constants/routes.ts 의 authCallback / premiumBilling* 과 같아야 한다.
       */
      if (
        ['/auth/callback', '/premium/billing/success', '/premium/billing/fail'].includes(
          location.pathname,
        )
      ) {
        document.documentElement.classList.add('no-splash');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div id="splash-road">
        <img alt="" src="/assets/wordmark/P.png" style="--l: 64.13%; --t: 10.10%; --w: 5.14%; --r: 12.3deg; --i: 0" />
        <img alt="" src="/assets/wordmark/I.png" style="--l: 70.94%; --t: 14.72%; --w: 3.03%; --r: 5.6deg; --i: 1" />
        <img alt="" src="/assets/wordmark/C.png" style="--l: 66.76%; --t: 21.97%; --w: 9.13%; --r: -7.3deg; --i: 2" />
        <img alt="" src="/assets/wordmark/T.png" style="--l: 50.83%; --t: 32.33%; --w: 10.43%; --r: -12.4deg; --i: 3" />
        <img alt="" src="/assets/wordmark/R.png" style="--l: 34.95%; --t: 40.49%; --w: 13.54%; --r: -10.6deg; --i: 4" />
        <img alt="" src="/assets/wordmark/E.png" style="--l: 24.11%; --t: 54.07%; --w: 15.06%; --r: 0.1deg; --i: 5" />
        <img alt="" src="/assets/wordmark/E.png" style="--l: 36.83%; --t: 70.61%; --w: 19.09%; --r: 11.8deg; --i: 6" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
